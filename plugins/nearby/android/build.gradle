// Capacitor-pluginin Android-moduuli (Kotlin). AGP ja Kotlin-gradle-plugin
// tulevat juuriprojektin classpathista (CI lisää Kotlin-classpathin).
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace "fi.pikajuoksu.nearby"
    compileSdk rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34
    defaultConfig {
        minSdk rootProject.ext.has('minSdkVersion') ? rootProject.ext.minSdkVersion : 23
        targetSdk rootProject.ext.has('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        buildConfig = false
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "com.google.android.gms:play-services-nearby:19.3.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
}
